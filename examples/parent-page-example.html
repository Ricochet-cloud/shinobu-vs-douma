<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커플카드 게임 임베드 예제</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .game-wrapper {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .game-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      aspect-ratio: 9 / 16;
      max-height: 90vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      font-size: 1.1em;
      margin-bottom: 12px;
      color: #333;
    }

    .status {
      font-size: 0.9em;
      line-height: 1.6;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #666;
      font-weight: 500;
    }

    .status-value {
      color: #333;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .badge.difficulty-easy {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .badge.difficulty-normal {
      background: #fff9c4;
      color: #f57f17;
    }

    .badge.difficulty-hard {
      background: #ffccbc;
      color: #d84315;
    }

    .badge.state-playing {
      background: #b3e5fc;
      color: #0277bd;
    }

    .badge.state-cleared {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .badge.state-failed {
      background: #ffcdd2;
      color: #c62828;
    }

    .reward-display {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 4px;
      margin-top: 10px;
    }

    .reward-display.active {
      background: #c8e6c9;
      border-left-color: #2e7d32;
    }

    .reward-display.failed {
      background: #ffcdd2;
      border-left-color: #c62828;
    }

    .log {
      max-height: 200px;
      overflow-y: auto;
      background: #1a1a1a;
      color: #00ff00;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.8em;
      line-height: 1.4;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #333;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: #888;
    }

    .log-type {
      color: #ffff00;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear {
      background: #667eea;
      color: white;
    }

    .btn-clear:hover {
      background: #5568d3;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: -1;
      }

      header h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 도우마 vs 시노부</h1>
      <p>커플카드 게임 iframe 임베드 예제</p>
    </header>

    <div class="content">
      <div class="game-wrapper">
        <!-- 게임 iframe 로드 -->
        <iframe
          id="gameFrame"
          src="./index.html"
          title="도우마 vs 시노부 게임"
        ></iframe>
      </div>

      <div class="sidebar">
        <!-- 게임 상태 -->
        <div class="card">
          <h3>📊 게임 상태</h3>
          <div class="status">
            <div class="status-item">
              <span class="status-label">난이도</span>
              <span class="status-value">
                <span class="badge" id="difficultyBadge">대기중</span>
              </span>
            </div>
            <div class="status-item">
              <span class="status-label">게임 상태</span>
              <span class="status-value">
                <span class="badge" id="gameBadge">대기중</span>
              </span>
            </div>
            <div class="status-item">
              <span class="status-label">플레이 시간</span>
              <span class="status-value" id="playtimeValue">-</span>
            </div>
            <div class="status-item">
              <span class="status-label">점수</span>
              <span class="status-value" id="scoreValue">-</span>
            </div>
          </div>
        </div>

        <!-- 보상 현황 -->
        <div class="card">
          <h3>🎁 보상 현황</h3>
          <div class="reward-display" id="rewardDisplay">
            <p style="margin: 0; color: #666;">게임을 진행해주세요</p>
          </div>
        </div>

        <!-- 이벤트 로그 -->
        <div class="card">
          <h3>📜 이벤트 로그</h3>
          <div class="log" id="eventLog">
            <div class="log-entry" style="color: #888;">로그 대기중...</div>
          </div>
          <div class="controls">
            <button class="btn-clear" onclick="clearLog()">로그 초기화</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * 게임 이벤트 처리 클래스
     */
    class GameEventHandler {
      constructor() {
        this.gameState = {
          difficulty: null,
          state: null,
          score: null,
          playtime: null,
          playerHp: null,
          playerLives: null,
          bossPhase: null
        };

        this.logs = [];
        this.setupMessageListener();
      }

      setupMessageListener() {
        window.addEventListener('message', (event) => {
          // 모든 origin에서 메시지 수신 가능 (개발 환경용)
          // 프로덕션: origin 검증 추가

          const { type, payload } = event.data;

          if (!type) return;

          console.log(`[GameEvent] ${type}:`, payload);
          this.logEvent(type, payload);

          switch (type) {
            case 'GAME_START':
              this.handleGameStart(payload);
              break;
            case 'GAME_CLEAR':
              this.handleGameClear(payload);
              break;
            case 'GAME_OVER':
              this.handleGameOver(payload);
              break;
            case 'GAME_RESTART':
              this.handleGameRestart(payload);
              break;
            case 'DIFFICULTY_CHANGED':
              this.handleDifficultyChanged(payload);
              break;
          }

          this.updateUI();
        });
      }

      handleGameStart(payload) {
        this.gameState.difficulty = payload.difficulty;
        this.gameState.state = 'PLAYING';
        this.gameState.playtime = 0;
        this.gameState.score = null;
      }

      handleGameClear(payload) {
        this.gameState.state = 'CLEARED';
        this.gameState.score = payload.player_score;
        this.gameState.playtime = payload.play_time;
        this.gameState.playerHp = payload.player_hp;
        this.gameState.playerLives = payload.player_lives;
        this.gameState.bossPhase = payload.boss_phase;

        // 백엔드에 보상 요청 시뮬레이션
        this.requestReward(payload);
      }

      handleGameOver(payload) {
        this.gameState.state = 'FAILED';
        this.gameState.playtime = payload.play_time;
        this.gameState.bossPhase = payload.boss_phase;
        this.gameState.playerHp = payload.player_hp;
        this.gameState.playerLives = payload.player_lives;
      }

      handleGameRestart(payload) {
        this.gameState.state = null;
        this.gameState.score = null;
        this.gameState.playtime = null;
      }

      handleDifficultyChanged(payload) {
        this.gameState.difficulty = payload.difficulty;
      }

      async requestReward(payload) {
        // 시뮬레이션: 백엔드 보상 요청
        console.log('보상 요청 중...', payload);

        // 실제 구현에서는:
        // const response = await fetch('/api/game-rewards/claim', {
        //   method: 'POST',
        //   body: JSON.stringify(payload)
        // });

        // 시뮬레이션 응답
        setTimeout(() => {
          const reward = Math.floor(Math.random() * 1000) + 500;
          this.logEvent('REWARD_GRANTED', { amount: reward });
          this.updateUI();
        }, 1000);
      }

      logEvent(type, data) {
        const time = new Date().toLocaleTimeString('ko-KR');
        this.logs.unshift({ time, type, data });

        if (this.logs.length > 20) {
          this.logs.pop();
        }

        this.updateLog();
      }

      updateLog() {
        const logEl = document.getElementById('eventLog');
        logEl.innerHTML = this.logs
          .map(log => `
            <div class="log-entry">
              <span class="log-time">[${log.time}]</span>
              <span class="log-type">${log.type}</span>
            </div>
          `)
          .join('');
      }

      updateUI() {
        // 난이도 배지
        const diffBadge = document.getElementById('difficultyBadge');
        if (this.gameState.difficulty) {
          const diffClass = `difficulty-${this.gameState.difficulty.toLowerCase()}`;
          diffBadge.textContent = this.gameState.difficulty;
          diffBadge.className = `badge ${diffClass}`;
        }

        // 게임 상태 배지
        const gameBadge = document.getElementById('gameBadge');
        if (this.gameState.state) {
          let text = this.gameState.state;
          let badgeClass = 'badge';

          if (this.gameState.state === 'PLAYING') {
            text = '진행중';
            badgeClass += ' state-playing';
          } else if (this.gameState.state === 'CLEARED') {
            text = '클리어 ✓';
            badgeClass += ' state-cleared';
          } else if (this.gameState.state === 'FAILED') {
            text = '실패';
            badgeClass += ' state-failed';
          }

          gameBadge.textContent = text;
          gameBadge.className = badgeClass;
        }

        // 플레이 시간
        const playtimeEl = document.getElementById('playtimeValue');
        if (this.gameState.playtime !== null) {
          playtimeEl.textContent = `${this.gameState.playtime}초`;
        }

        // 점수
        const scoreEl = document.getElementById('scoreValue');
        if (this.gameState.score !== null) {
          scoreEl.textContent = `${this.gameState.score.toLocaleString()}`;
        }

        // 보상 현황
        const rewardEl = document.getElementById('rewardDisplay');
        if (this.gameState.state === 'CLEARED') {
          rewardEl.innerHTML = `
            <div style="color: #2e7d32;">
              <p style="margin: 0; font-weight: bold;">🎉 클리어 성공!</p>
              <p style="margin: 8px 0 0 0; font-size: 0.9em;">
                HP: ${this.gameState.playerHp} | 남은 목숨: ${this.gameState.playerLives}
              </p>
              <p style="margin: 4px 0 0 0; font-size: 0.9em;">
                점수: ${this.gameState.score.toLocaleString()}
              </p>
            </div>
          `;
          rewardEl.className = 'reward-display active';
        } else if (this.gameState.state === 'FAILED') {
          rewardEl.innerHTML = `
            <div style="color: #c62828;">
              <p style="margin: 0; font-weight: bold;">💔 게임 오버</p>
              <p style="margin: 8px 0 0 0; font-size: 0.9em;">
                도우마 페이즈: ${this.gameState.bossPhase}
              </p>
              <p style="margin: 4px 0 0 0; font-size: 0.9em;">
                플레이 시간: ${this.gameState.playtime}초
              </p>
            </div>
          `;
          rewardEl.className = 'reward-display failed';
        } else {
          rewardEl.innerHTML = '<p style="margin: 0; color: #666;">게임을 진행해주세요</p>';
          rewardEl.className = 'reward-display';
        }
      }
    }

    // 로그 초기화
    function clearLog() {
      document.getElementById('eventLog').innerHTML =
        '<div class="log-entry" style="color: #888;">로그 초기화됨</div>';
      handler.logs = [];
    }

    // 초기화
    const handler = new GameEventHandler();
  </script>
</body>
</html>
